<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <style>
            .skills { display: flex; gap: 3em; }
            .skills section { flex: 1; min-width: 0; }
            li { width: 100%; float: none; padding-right: 0; }
            li:nth-child(even) { margin-bottom: 0; }
        </style>
    </head>

    <body>
        <div class="skills">
            <section>
                <h2>Frontend</h2>
                <ul>
                    <li>
                        <p data-value="80">HTML5</p>
                        <progress class="html5" value="80" max="100">
                            <div class="progress-bar"><span style="width: 80%">80%</span></div>
                        </progress>
                    </li>
                    <li>
                        <p data-value="60">CSS3</p>
                        <progress class="html5" value="60" max="100">
                            <div class="progress-bar"><span style="width: 60%">60%</span></div>
                        </progress>
                    </li>
                    <li>
                        <p data-value="50">jQuery</p>
                        <progress class="html5" value="50" max="100">
                            <div class="progress-bar"><span style="width: 50%">50%</span></div>
                        </progress>
                    </li>
                </ul>
            </section>

            <section>
                <h2>Backend</h2>
                <ul>
                    <li>
                        <p data-value="75">Python</p>
                        <progress class="html5" value="75" max="100">
                            <div class="progress-bar"><span style="width: 75%">75%</span></div>
                        </progress>
                    </li>
                    <li>
                        <p data-value="65">PHP</p>
                        <progress class="html5" value="65" max="100">
                            <div class="progress-bar"><span style="width: 65%">65%</span></div>
                        </progress>
                    </li>
                    <li>
                        <p data-value="35">Node.js</p>
                        <progress class="html5" value="35" max="100">
                            <div class="progress-bar"><span style="width: 35%">35%</span></div>
                        </progress>
                    </li>
                </ul>
            </section>
        </div>
    </body>
</html>
